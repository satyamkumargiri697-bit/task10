<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Laundry Services - Hero Animation</title>
    <!-- CSS file ko link kiya gaya hai -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header / Navbar Section -->
    <header class="navbar">
        <div class="logo">Logo</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Services</a>
            <a href="#">About Us</a>
            <a href="#">Contact Us</a>
        </nav>
        <button class="nav-btn">Username</button>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-content">
            <h1>Revitalize Your <br><span>Clothes with Expert</span> <br><section class="blue-text">Laundry Services!</section></h1>
            <p>Every stain tells a story, but we prefer a clean and fresh end. Experience a pick-up and delivery that fits right into your busy schedule.</p>
            <button class="hero-btn">Book an order today!</button>
        </div>
        
        <!-- Hero Image Container jisme animation apply hoga -->
        <div class="hero-image-container">
            <!-- Aap apni laundry image ka sahi path yahan 'src' me daal sakte hain -->
            <img src="l.jpg" alt="Laundry Machine" class="animate-hero-image">
        </div>
    </section>

</body>
</html>
